name: Resmi Gazete Saglik Scraper

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Kodları Depodan Çek
        uses: actions/checkout@v4
      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Gerekli Kütüphaneleri Yükle
        run: |
          pip install -r requirements.txt
      - name: Scraper Scriptini Çalıştır
        run: |
          python scraper.py
      - name: Bulutta Oluşan JSON Dosyasını Depoya Kaydet
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Otomatik Günlük Resmi Gazete Sağlık Taraması"
          file_pattern: "saglik_arsiv_2026.json"
